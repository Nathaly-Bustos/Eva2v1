<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatronaPlus - Panel</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fas fa-heart-pulse me-2"></i>MatronaPlus
      </a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline">Bienvenida, <span id="nombre-usuario">Usuario</span></span>
        <button id="btn-cerrar-sesion" class="btn btn-outline-light">
          <i class="fas fa-sign-out-alt"></i>
          <span class="d-none d-sm-inline ms-1">Salir</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-fluid py-4">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-lg-3 mb-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <ul class="nav flex-column">
              <li class="nav-item">
                <button class="nav-link active btn btn-link text-start" data-bs-toggle="tab" data-bs-target="#tab-turnos">
                  <i class="fas fa-calendar-check me-2"></i>Turnos
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link btn btn-link text-start" data-bs-toggle="tab" data-bs-target="#tab-pacientes">
                  <i class="fas fa-user-friends me-2"></i>Pacientes
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link btn btn-link text-start" data-bs-toggle="tab" data-bs-target="#tab-agendar">
                  <i class="fas fa-plus-circle me-2"></i>Nuevo Turno
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Contenido dinámico -->
      <div class="col-lg-9">
        <div class="tab-content">
          <!-- Pestaña de Turnos -->
          <div class="tab-pane fade show active" id="tab-turnos">
            <div class="card shadow-sm mb-4">
              <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0"><i class="fas fa-calendar-check me-2"></i>Turnos Programados</h5>
                  <div class="input-group w-50">
                    <input type="text" id="busqueda-turnos" class="form-control" placeholder="Buscar turnos...">
                    <button class="btn btn-light" type="button">
                      <i class="fas fa-search"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead>
                      <tr>
                        <th>Fecha/Hora</th>
                        <th>Paciente</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="tabla-turnos">
                      <!-- Turnos se cargan aquí -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Pestaña de Pacientes -->
          <div class="tab-pane fade" id="tab-pacientes">
            <!-- Contenido similar adaptado para pacientes -->
          </div>

          <!-- Pestaña de Agendar -->
          <div class="tab-pane fade" id="tab-agendar">
            <!-- Formulario de agendamiento -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Ficha Clínica -->
  <div class="modal fade" id="modal-ficha" tabindex="-1">
    <!-- Contenido del modal -->
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica principal -->
  <script src="app.js"></script>
</body>
</html>
