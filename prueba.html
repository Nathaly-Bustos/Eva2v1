<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validación de Prueba</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <form id="form-prueba" novalidate class="needs-validation">
    <div class="mb-3">
      <label for="rut" class="form-label">RUT</label>
      <input type="text" id="rut" class="form-control" required>
      <div class="invalid-feedback">RUT inválido</div>
    </div>
    <div class="mb-3">
      <label for="fur" class="form-label">FUR</label>
      <input type="date" id="fur" class="form-control" required>
      <div class="invalid-feedback">La FUR no puede ser futura</div>
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-prueba');
      form.addEventListener('submit', function (event) {
        let isValid = form.checkValidity();

        const rut = document.getElementById('rut');
        if (!validarRUT(rut.value)) {
          rut.setCustomValidity('RUT inválido');
          isValid = false;
        } else {
          rut.setCustomValidity('');
        }

        const fur = document.getElementById('fur');
        if (fur.value && new Date(fur.value) > new Date()) {
          fur.setCustomValidity('Fecha futura no válida');
          isValid = false;
        } else {
          fur.setCustomValidity('');
        }

        if (!isValid) {
          event.preventDefault();
          event.stopPropagation();
        }

        form.classList.add('was-validated');
      });

      function validarRUT(rut) {
        rut = rut.replace(/\./g, '').replace(/-/g, '').toUpperCase();
        if (!/^[0-9]+[0-9K]$/.test(rut)) return false;

        const cuerpo = rut.slice(0, -1);
        const dv = rut.slice(-1);
        let suma = 0, multiplo = 2;
        for (let i = cuerpo.length - 1; i >= 0; i--) {
          suma += +cuerpo[i] * multiplo;
          multiplo = multiplo === 7 ? 2 : multiplo + 1;
        }
        const dvEsperado = 11 - (suma % 11);
        const dvFinal = dvEsperado === 11 ? '0' : dvEsperado === 10 ? 'K' : dvEsperado.toString();
        return dv === dvFinal;
      }
    });
  </script>

</body>
</html>
